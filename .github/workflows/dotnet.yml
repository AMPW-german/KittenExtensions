name: KittenExtensions CI

permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-package:
    runs-on: ubuntu-slim
    outputs:
      versionprefix_changed: ${{ steps.versionprefix.outputs.changed }}
      version: ${{ steps.versionprefix.outputs.version }}
      ksa_version: ${{ steps.ksa-version.outputs.version }}
      artifact_name: ${{ steps.artifact-name.outputs.name }}
      release_needed: ${{ steps.release-check.outputs.release_needed }}
    env:
      CONFIGURATION: ${{ github.event_name == 'pull_request' && 'Debug' || 'Release' }}
      KSA_DLL_REPOSITORY: ${{ secrets.KSADLLRepo }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Prepare dependency folders
        shell: bash
        run: |
          mkdir -p deps deps/extracted deps/ksa

      - name: Validate private KSA DLL repository setting
        if: ${{ env.KSA_DLL_REPOSITORY == '' }}
        shell: bash
        run: |
          echo "Missing repository variable KSA_DLL_REPOSITORY (expected format: owner/repo)." >&2
          exit 1

      - name: Parse private KSA DLL repository
        id: ksa-repo
        shell: bash
        run: |
          owner="${KSA_DLL_REPOSITORY%%/*}"
          repo="${KSA_DLL_REPOSITORY##*/}"
          if [ -z "$owner" ] || [ -z "$repo" ] || [ "$owner" = "$repo" ]; then
            echo "Invalid KSADLLRepo secret value: ${KSA_DLL_REPOSITORY}. Expected owner/repo." >&2
            exit 1
          fi
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token for KSA DLL repo
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.ksa-repo.outputs.owner }}
          repositories: ${{ steps.ksa-repo.outputs.repo }}

      - name: Download private KSA DLLs from repository
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${KSA_DLL_REPOSITORY}.git" deps/ksa-repo
          find deps/ksa-repo -maxdepth 1 -type f -exec cp {} deps/ksa/ \;
          dll_count=$(find deps/ksa -maxdepth 1 -type f -name '*.dll' | wc -l)
          if [ "$dll_count" -eq 0 ]; then
            echo "No DLL files found in root of ${KSA_DLL_REPOSITORY}." >&2
            exit 1
          fi

      - name: Collect KSA version
        id: ksa-version
        shell: bash
        run: |
          ksa_version_txt="deps/ksa/KSA_VERSION.txt"
          if [ ! -f "$ksa_version_txt" ]; then
            echo "KSA_VERSION.txt not found in deps/ksa. Cannot determine KSA version." >&2
            exit 1
          fi
          echo "version=$(cat "$ksa_version_txt")" >> "$GITHUB_OUTPUT"

      - name: Detect VersionPrefix change on main push
        id: versionprefix
        shell: bash
        run: |
          version=v$(grep -oPm1 '(?<=<VersionPrefix>)[^<]+' KittenExtensions/KittenExtensions.csproj)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff "$before" "${{ github.sha }}" -- KittenExtensions/KittenExtensions.csproj | grep -q 'VersionPrefix'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if current version needs release
        id: release-check
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          new_version="${{ steps.versionprefix.outputs.version }}"
          release_response=$(curl -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest")

          current_version=$(echo "$release_response" | jq -r '.tag_name // empty')

          if [ -z "$current_version" ]; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          elif [ "$new_version" != "$current_version" ]; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore nuget dependencies
        run: dotnet restore KittenExtensions/KittenExtensions.csproj

      - name: Build KittenExtensions
        shell: bash
        run: |
          rm -rf Release/KittenExtensions
          mkdir -p Release/KittenExtensions

          deps_dir="$(pwd)/deps"
          ksa_dir="$deps_dir/ksa/"
          dotnet build KittenExtensions/KittenExtensions.csproj -c "$CONFIGURATION" --no-restore /p:KSADir="$ksa_dir" /p:KSAModsDir="$deps_dir"

      - name: Compute artifact name
        id: artifact-name
        shell: bash
        run: |
          version="${{ steps.versionprefix.outputs.version }}"
          short_hash="${GITHUB_SHA::7}"

          if [ "$CONFIGURATION" = "Debug" ]; then
            artifact_name="KittenExtensions-${version}-${short_hash}-debug"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && [ "${{ steps.versionprefix.outputs.changed }}" = "true" ]; then
            artifact_name="KittenExtensions-${version}"
          else
            artifact_name="KittenExtensions-${version}-${short_hash}"
          fi

          echo "name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: Release/

  release:
    runs-on: ubuntu-slim
    needs: build-package
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-package.outputs.release_needed == 'true' }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-package.outputs.artifact_name }}
          path: release-assets

      - name: Zip release payload
        shell: bash
        run: |
          artifact_name="${{ needs.build-package.outputs.artifact_name }}"
          cd release-assets
          zip -r "../${artifact_name}.zip" .

      - name: Create GitHub release
        id: github-release
        shell: bash
        run: |
          json_payload=$(jq -n \
            --arg tag_name "${{ needs.build-package.outputs.version }}" \
            --arg name "${{ needs.build-package.outputs.version }}" \
            --arg body "Built for KSA version ${{ needs.build-package.outputs.ksa_version }}" \
            '{ tag_name: $tag_name, name: $name, body: $body, draft: true, prerelease: false, generate_release_notes: true }')

          echo "Creating release with payload: $json_payload"
          response_file=$(mktemp)
          http_status=$(curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "$json_payload" \
            -o "$response_file" \
            -w "%{http_code}")

          if [ "$http_status" -ne 201 ]; then
            echo "Failed to create release. Expected HTTP 201, got HTTP $http_status." >&2
            cat "$response_file" >&2
            exit 1
          fi

          upload_url=$(jq -r '.upload_url' "$response_file")
          if [ -z "$upload_url" ] || [ "$upload_url" = "null" ]; then
            echo "Release created but upload_url is missing in response." >&2
            cat "$response_file" >&2
            exit 1
          fi

          upload_url="${upload_url%\{*}"
          asset_name="${{ needs.build-package.outputs.artifact_name }}.zip"
          asset_path="$asset_name"

          if [ ! -f "$asset_path" ]; then
            echo "Expected release asset file '$asset_path' was not found." >&2
            exit 1
          fi

          echo "Uploading release asset: $asset_name"
          upload_response_file=$(mktemp)
          upload_status=$(curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/zip" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            --data-binary @"$asset_path" \
            "${upload_url}?name=${asset_name}" \
            -o "$upload_response_file" \
            -w "%{http_code}")

          if [ "$upload_status" -ne 201 ]; then
            echo "Failed to upload release asset. Expected HTTP 201, got HTTP $upload_status." >&2
            cat "$upload_response_file" >&2
            exit 1
          fi

          release_id=$(jq -r '.id' "$response_file")
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "Release created but id is missing in response." >&2
            cat "$response_file" >&2
            exit 1
          fi

          publish_payload='{"draft":false}'
          publish_response_file=$(mktemp)
          publish_status=$(curl -sS -L -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/${{ github.repository }}/releases/$release_id \
            -d "$publish_payload" \
            -o "$publish_response_file" \
            -w "%{http_code}")

          if [ "$publish_status" -ne 200 ]; then
            echo "Failed to publish release. Expected HTTP 200, got HTTP $publish_status." >&2
            cat "$publish_response_file" >&2
            exit 1
          fi

          release_changelog=$(jq -r '.body // ""' "$publish_response_file")
          {
            echo "changelog<<EOF"
            echo "$release_changelog"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Release created and asset uploaded successfully."

      - name: Create SpaceDock release
        shell: bash
        env:
          SPACEDOCK_USERNAME: ${{ vars.SPACEDOCKUSERNAME }}
          SPACEDOCK_PASSWORD: ${{ secrets.SPACEDOCKAUTH }}
          RELEASE_VERSION: ${{ needs.build-package.outputs.version }}
          RELEASE_CHANGELOG: ${{ steps.github-release.outputs.changelog }}
          KSA_VERSION: ${{ needs.build-package.outputs.ksa_version }}
          ZIPBALL: ${{ needs.build-package.outputs.artifact_name }}.zip
        run: |
          printf '%s' "$RELEASE_CHANGELOG" > spacedock-changelog.md

          curl --form-string "username=$SPACEDOCK_USERNAME" \
               --form-string "password=$SPACEDOCK_PASSWORD" \
               -c ./cookies \
               https://spacedock.info/api/login

          curl -b ./cookies \
               --form-string "version=$RELEASE_VERSION" \
               -F "changelog=<spacedock-changelog.md" \
               --form-string "game-version=$KSA_VERSION" \
               --form-string "notify-followers=yes" \
               -F "zipball=@$ZIPBALL" \
               https://spacedock.info/api/mod/4588/update